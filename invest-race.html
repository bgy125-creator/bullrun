:root[data-theme="dark"]{--bg:#1b1a17;--card:#26241f;--tx:#f1ece0;--mut:#a79f8d;--pri:#ff922b;--ok:#69db7c;--no:#ff8787;--bd:#3a372f;color-scheme:dark}

main{max-width:520px;margin:0 auto;padding:16px}

.mut{color:var(--mut);font-size:13px}
button,input{font:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;margin-top:8px}
.btn:disabled{opacity:.4}

.opt{display:block;width:100%;text-align:left;padding:11px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.opt.sel{border-color:var(--pri);background:rgba(232,89,12,.12)}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--no)}
.up{color:var(--no)}.dn{color:#1971c2}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.me{font-weight:700;color:var(--pri)}
.note{font-size:12px;color:var(--mut);margin-top:16px}
.hero{text-align:center;padding:22px 10px;border-radius:16px;background:linear-gradient(135deg,var(--pri),#fab005);color:#fff}
.hero h1{margin:6px 0}.hero small{font-size:16px}.hero p{margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.st{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
ol{padding-left:20px;margin:0}ol li{margin:6px 0}.big{font-size:24px;font-weight:800;line-height:1.3}.amt{width:120px;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-align:right}details{margin:12px 0}summary{font-weight:700}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes fadeout{to{opacity:0;transform:scale(.6)}}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}60%{opacity:1;transform:scale(1.35) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes flash{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 6px #fab005}50%{box-shadow:0 0 24px #fab005}}
.stage{position:relative;height:130px;text-align:center;font-size:84px;line-height:130px}
.stage span{position:absolute;left:0;right:0}
.l1{animation:shake .9s ease .2s both,fadeout .3s ease 1.1s forwards}
.l2{opacity:0;animation:pop .6s ease 1.2s forwards}
.fl{position:absolute;inset:-20px;background:radial-gradient(circle,#fff,#ffe066 40%,transparent 70%);opacity:0;animation:flash .7s ease 1.2s}
.stage .sp{left:auto;right:auto;width:auto;font-size:28px;line-height:1;opacity:0;animation:pop .6s ease 1.25s forwards}
.secret{border:2px solid #fab005;background:linear-gradient(110deg,var(--card) 35%,rgba(250,176,5,.4) 50%,var(--card) 65%);background-size:200% 100%;animation:reveal .6s ease 1.7s both,sweep 1.8s linear 2.3s 2,glow 1.6s ease 2.3s 3}
.late{animation:reveal .5s ease 2.3s both}
@media(prefers-reduced-motion:reduce){.l1,.l2,.fl,.sp,.secret,.late{animation-duration:.01s!important;animation-delay:0s!important}}
@keyframes sad{0%{opacity:0;transform:translateY(-40px) scale(.4)}60%{opacity:1;transform:translateY(10px) scale(1.15)}100%{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sadst{height:150px;font-size:110px;line-height:150px}
.sad{opacity:0;animation:sad .9s ease .2s forwards}
.bigicon{font-size:96px;line-height:1.15}
@media(prefers-reduced-motion:reduce){.sad,.bigicon{animation-duration:.01s!important;animation-delay:0s!important}}
textarea{font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:8px;width:100%}

function srcCard(){return `<details class="card"><summary>📎 출처·검증 상태</summary><p><b>확인한 자료</b></p><ul><li>코스피, 원/달러 환율, 금 가격(IMF, 원화로 환산), 한국은행 기준금리: 직접 올려 주신 한국거래소·ECOS·한국은행·IMF·금융투자협회 자료로 계산했어요.</li><li>S&P500: 미국 달러 기준 연간 총수익률(배당 포함, slickcharts)에 원/달러 연말 환율 변화를 반영해 원화로 바꿨어요.</li><li>유가(WTI 연평균): FRED(미국 세인트루이스 연준). 소비자물가 상승률: FRED(세계은행 자료).</li><li>개별 주식 8종: 연말 종가로 주가 변화율만 계산했어요(배당 제외, 액면분할·무상증자·감자는 반영). 기존 자료(simianx.ai·digrin.com)와 Yahoo Finance 연말 종가를 비교해 차이가 1% 안인 해는 그대로 쓰고, 다른 해는 금융감독원 전자공시(DART) 원문과 신문 기사로 확인한 쪽을 썼어요.</li><li>K-통신(KT): Yahoo Finance 연말 종가를 DART 사업보고서의 '12월 최고·최저 주가'와 맞춰 봤어요. 대부분 해는 정확히 맞고, 2015·2020년은 100~150원 차이, 2004년은 보고서에서 표를 찾지 못했어요. 1999년 말 종가 179,000원은 DART의 발행주식 수(312,199,659주)와 그날 시가총액 55조 8,837억 원(이투데이 보도)이 맞아떨어져요.</li><li>DART 원문으로 확인: SM엔터 2005년 무상증자(1주당 1.1241993주, 6월 23일 결정), 태평양 2006년 분할(1주당 태평양 0.3790095주 + 아모레퍼시픽 0.6209905주).</li><li>바로잡은 값: 삼성전자 2007·2008년, 아모레퍼시픽 2007·2008년, LG화학 2007~2009년(2009년은 "1월 7만 5,100원 출발, 1년 새 204.26% 상승" 기사와 일치), SM엔터 2012년(10% 무상증자 반영, SBS 보도), 셀트리온 2012년(1주당 0.5주 무상증자 반영)·2025년(0.04주 무상증자 반영).</li><li>K-조선(삼성중공업): Yahoo Finance 연말 종가를 DART 사업보고서의 12월 최고·최저 주가와 맞춰 봤어요. Yahoo 값은 2016·2018·2021년 유상증자(주주에게 새 주식을 살 권리를 준 증자) 때 증권사 '수정주가'처럼 옛 주가를 조정한 값이에요. 2021년 감자는 액면가만 5,000원에서 1,000원으로 낮춘 것이라 주가에는 영향이 없어요. 1999년 말 종가 5,490원은 digrin.com 값이고 DART의 1999년 12월 범위(5,490~7,350원) 안이에요.</li></ul><p><b>검증 전 · 대신 쓴 값</b></p><ul><li>정기예금: 은행별 예금금리 자료가 없어, 투자 시작일의 한국은행 기준금리를 정기예금 금리로 가정해 계산했어요(실제 예금금리와는 다를 수 있어요).</li><li>2000~2010년의 세계 이슈와 S&P500 시황은 날짜·숫자를 검색으로 확인했어요(미국 연준 금리 기록, 위키피디아, CNN·블룸버그·벤징가 등 언론 보도). 뉴스 브리핑은 이 사실을 쉽게 풀어 쓴 해설이에요. 2000~2010년 기업 사건과 2001년 LG화학 분할 등은 위키피디아(영문)·LG 연혁·경향신문 한 곳씩만 확인했어요. 금 뉴스는 올려 주신 IMF 월평균 자료로, 정기예금 뉴스는 한국은행 기준금리 변경일로 만들었어요.</li><li>🔒 표시 상품: 연말 종가 자료를 확인하지 못해 투자할 수 없어요. 아모레퍼시픽 2006년 이전(태평양 시절)이 여기에 해당해요. 분할 비율은 DART에서 확인했지만, 분할 전후의 정확한 연말 종가를 두 곳에서 확인하지 못했어요(한국거래소 정보데이터시스템은 로그인이 필요해 쓸 수 없었어요). 아직 상장하지 않았던 종목(SM엔터 2000년 이전, 셀트리온 2008년 이전, LG화학 2001년 이전)은 목록에 보이지 않아요.</li><li>셀트리온: 2008년 8월 19일 코스닥 상장사 오알켐(2005년 7월 19일 상장)과 합병해 우회상장했어요(이투데이·데일리팜 보도, 셀트리온 공시 목록). 그래서 2008년 이전 주가는 셀트리온이 아닌 오알켐 주가라 쓰지 않고, 2009년 이후만 투자할 수 있어요.</li></ul></details>`}

const NB1=["IT(정보기술) 회사에 대한 기대가 너무 커져 거품이 꼈다가 꺼지자, 투자자들이 기술주를 급하게 팔았어요. 주가가 실제 가치보다 높아졌다가 되돌아오는 일을 '거품 붕괴'라고 해요.","큰 사건이 터지면 불안이 퍼져 사람들이 위험한 투자를 피해요. 각국은 경기를 살리려고 금리를 내려요.","경제가 어려울 때는 금리가 낮아지고, 사람들이 빚을 내서 소비를 늘리기도 해요. 빚이 지나치게 늘면 나중에 위험이 될 수 있어요.","빌린 돈을 갚지 못하는 사람이 늘면 금융회사가 어려워져요. 전쟁 같은 불안 요소까지 겹치면 투자자들이 조심스러워져요.","미국이 금리를 올리기 시작하면 달러 자산이 매력적으로 보이고 신흥국 투자엔 부담이 될 수 있어요. 한편 중국의 빠른 성장은 원자재와 한국 수출을 늘렸어요.","기름값이 오르면 기업의 연료비와 물건 값이 오르고, 사람들이 쓰는 돈이 줄 수 있어요. 그래도 세계 경제가 커지면 주식 시장은 오를 수 있어요.","금리 인상이 끝나 간다는 기대는 주식에 좋은 소식이에요. 하지만 원화 값이 오르면(환율 하락) 수출 기업은 같은 물건을 팔아도 원화로 받는 돈이 줄어요.","미국 집값이 꺾이면서 집을 담보로 빌려준 돈(서브프라임)의 부실이 퍼지기 시작했어요. 그래도 한국 증시는 중국 수요와 조선·기계 기업의 이익 기대로 크게 올랐어요.","큰 금융회사가 무너지자 은행들이 서로 돈을 빌려주지 않게 되었고, 전 세계 주식이 동시에 떨어졌어요. 달러가 귀해지면서 원/달러 환율도 크게 올랐어요.","각국이 금리를 크게 내리고 돈을 풀자 불안이 줄면서 주식이 빠르게 회복했어요.","미국이 돈을 더 푸는 정책(양적완화)을 이어 갔고, 유럽 일부 나라의 빚 문제가 드러났어요. 돈이 넘치면 주식과 금 같은 자산 값이 오르기 쉬워요.",'유럽 나라들이 빚을 갚기 어렵지 않을까 걱정되자, 사람들이 위험한 투자를 피하고 금과 달러 같은 안전한 자산을 찾았어요. (위험회피)','유럽 위기가 진정되며 불안이 줄자 신흥국으로 돈이 다시 들어왔어요. 환율이 내려가면(원화 강세) 수출 기업엔 불리하고 수입 기업엔 유리해요.','미국이 돈을 푸는 속도를 줄일 거란 소식(테이퍼링)에 신흥국에서 돈이 빠질까 걱정이 커요. 하지만 우리나라는 수출로 번 돈이 많아 원화는 오히려 강했어요.','유가가 크게 떨어지면 기름값이 싸져 항공·운송업은 반가웠지만, 정유·화학 회사는 제품을 팔 수 있는 값이 내려가 힘들어요.','중국 경제가 느려지면 중국에 많이 파는 한국 수출이 줄어요. 수출 기업의 실적 걱정이 커지고 낮은 유가도 한몫해요.','금리가 낮은 상태에서 브렉시트(영국의 EU 탈퇴)와 미국 대선 같은 큰 이벤트로 시장이 크게 흔들렸어요. 투자자들이 예금 말고 갈 곳을 찾은 해예요.','세계 경제가 함께 좋아지면서 우리 수출이 늘었어요. 특히 반도체 값이 오르며 기업 이익이 크게 늘어 코스피가 크게 올랐어요.','미국이 금리를 올리고 미국·중국이 관세로 싸우자 달러가 인기를 끌고 신흥국 주식은 약해졌어요.','미국의 단기 금리가 장기 금리보다 높아지는 일(금리 역전)은 경기가 나빠질 신호로 읽혀요. 그래서 미국이 금리를 내리며 대비했어요.','코로나로 경제가 멈추자 각국이 금리를 거의 0으로 내리고 돈을 크게 풀었어요. 갈 곳 잃은 돈이 주식으로 몰렸고(동학개미) 성장 기대가 큰 주식이 인기였어요.','물건이 부족해 값이 오르는(인플레이션) 걱정이 커지고, 미국이 돈 푸는 걸 줄일 계획을 알렸어요. 넘치던 돈의 파티가 끝나 가는 신호였어요.','전쟁으로 에너지 값이 뛰고 물가가 치솟자 미국이 금리를 아주 빠르게 올렸어요. 달러가 강해지고 미래 성장을 기대하는 주식 값이 크게 내려갔어요.','금리가 높은 채로 오래 간다는 전망이 나왔지만, 인공지능(AI) 덕분에 반도체 수요가 다시 살아날 거란 기대도 커졌어요.','AI 열풍으로 반도체 투자가 커졌고 미국이 금리를 내리기 시작했어요. 한편 환율이 크게 오르면서 외국인 투자자의 사고팔기 흐름이 흔들렸어요.','미국의 관세 정책으로 불확실성이 커지자 안전한 자산인 금이 크게 올랐어요. 우리나라는 기업이 주주에게 더 잘 나눠 주도록 하는 정책(밸류업) 기대도 컸어요.'];
const NB2=["거품이 꼈던 분야는 한꺼번에 크게 떨어질 수 있어요. 한 분야에 몰아 투자하면 위험하다는 걸 보여 주는 해예요.","불안한 시기엔 금 같은 안전자산이 상대적으로 잘 버텨요. 금리가 내려가면 예금 이자는 줄어요.","금리가 낮아지면 예금 이자가 줄어요. 그래서 안전하면서도 수익이 나는 곳을 찾는 사람이 늘어요.","불안이 줄고 경기가 살아나기 시작하면, 많이 떨어졌던 주식이 다시 오르기 쉬워요.","세계 경제가 좋아지면 수출 비중이 큰 기업이나 원자재와 관련된 기업의 이익이 늘기 쉬워요.","기름값이 오르면 항공·운송 회사는 힘들고, 석유·에너지 관련 기업은 이익이 늘 수 있어요.","환율이 내려가면 수출 기업은 불리하고, 수입 기업이나 해외여행에는 유리해요. 환율 뉴스를 같이 봐야 해요.","경기가 좋을 때는 주가가 빠르게 올라 가격 부담이 커지기도 해요. 너무 올랐을 때 한 번에 몰아서 사는 건 조심해야 해요.","모든 주식이 함께 떨어지는 위기에는 주식끼리만 나누는 분산투자로는 한계가 있어요. 그래서 금이나 현금 같은 자산이 방패가 되기도 해요.","위기 뒤의 반등은 빠르게 와요. 바닥에서 겁먹고 다 팔면 회복의 이익을 놓칠 수 있어요.","돈이 넘칠 때는 금이나 주식 같은 자산이 인기를 끌지만, 나라 빚 문제 같은 뉴스에는 갑자기 흔들릴 수 있어요.",'안전자산 선호가 강할 때는 보통 금이 강하고 위험이 큰 주식은 흔들려요. 분산투자가 왜 필요한지 보여주는 해예요.','위기가 진정되면 이익에 비해 주식이 싼 느낌이 들어(낮은 PER) 다시 사들이는 사람이 늘어요.','달러가 강해질 때 달러로 거래되는 금은 값이 내려가기 쉬워요. 금 투자는 환율과 금리 뉴스를 같이 봐야 해요.','유가가 내리면 연료비가 줄어드는 업종은 웃고, 석유·화학 업종은 이익이 줄 수 있어요.','수출 비중이 큰 기업은 중국 경기 뉴스에 민감해요. 중국 관광객 매출이 큰 소비재 회사도 영향을 받아요.','큰 이벤트로 시장이 흔들릴 때는 변동성(가격이 오르내리는 폭)이 커져요. 한 곳에 몰아 투자하면 위험하다는 걸 기억해요.','반도체 값이 오르면 메모리를 만드는 회사의 이익이 크게 늘어요. 이익이 늘면 주가도 따라 오르기 쉬워요.','달러가 강하면 신흥국 주식이 약해지기 쉬워요. 이럴 땐 예금이나 금처럼 흔들림이 적은 자산도 선택지가 돼요.','금리가 내려가면 예금 이자는 줄고, 대신 금이나 주식 쪽으로 눈을 돌리는 사람이 늘어요.','금리가 아주 낮으면 예금의 매력이 떨어져요. 미래에 크게 성장할 회사(바이오·IT)의 값이 오르기 쉬운 환경이에요.','돈이 많이 풀린 뒤에는 주식이 이미 많이 올라 비싸졌을(고평가) 수 있어요. 비싼 가격에 사는 건 조심해야 해요.','금리가 오르면 예금 이자는 커지고, 아직 이익이 작은 성장주는 가격 부담이 커져 내려가기 쉬워요.','반도체는 쌓인 재고를 다 팔고 나면 다시 주문이 늘어요. 바닥을 지나는 신호를 찾는 게 중요해요.','AI 서버에 쓰는 고성능 메모리(HBM) 수요가 늘면 관련 회사가 주목받아요. 환율이 오르면 수출 기업 매출이 원화로는 더 커져요.','불안한 시기엔 금이 인기를 끌고, 주주에게 이익을 나눠 주는 회사(배당·자사주)가 주목받아요.'];
