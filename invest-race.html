const NB1=["IT(정보기술) 회사에 대한 기대가 너무 커져 주가에 거품이 낀 것 같다는 걱정이 나와요. 주가가 실제 가치보다 높아졌다가 되돌아오는 일을 '거품 붕괴'라고 하는데, 그런 일이 생길 수도 있어요.","큰 사건이 터지면 불안이 퍼져 사람들이 위험한 투자를 피할 수 있어요. 각국은 경기를 살리려고 금리를 더 내릴 가능성이 있어요.","경제가 어려워 금리가 낮아지면, 사람들이 빚을 내서 소비를 늘릴 수 있어요. 빚이 지나치게 늘면 나중에 위험이 될 수 있어요.","빌린 돈을 갚지 못하는 사람이 늘면 금융회사가 어려워질 수 있어요. 전쟁 같은 불안 요소까지 겹치면 투자자들이 더 조심스러워질 것 같아요.","미국이 금리를 올리기 시작하면 달러 자산이 매력적으로 보여 신흥국 투자에는 부담이 될 수 있어요. 한편 중국이 빠르게 성장하고 있어 원자재 수요와 한국 수출이 늘 수 있어요.","기름값이 오르면 기업의 연료비와 물건 값이 오르고, 사람들이 쓰는 돈이 줄 수 있어요. 그래도 세계 경제가 커지면 주식 시장은 오를 수 있어요.","금리 인상이 끝나 간다는 기대는 주식에 좋은 소식이 될 수 있어요. 하지만 원화 값이 오르면(환율 하락) 수출 기업은 같은 물건을 팔아도 원화로 받는 돈이 줄 수 있어요.","미국 집값이 꺾이면서 집을 담보로 빌려준 돈(서브프라임)이 제대로 돌아오지 않을 수 있다는 걱정이 나오고 있어요. 그래도 중국 수요가 크고 조선·기계 기업의 이익이 늘 거라는 기대도 커 보여요.","큰 금융회사가 흔들리면 은행들이 서로 돈을 빌려주지 않으려 할 수 있고, 그러면 전 세계 주식이 함께 떨어질 수 있어요. 달러가 귀해지면 원/달러 환율이 크게 오를 수도 있어요.","각국이 금리를 크게 내리고 돈을 풀고 있어서, 불안이 줄어들면 주식이 회복할 수도 있어요.","미국이 돈을 더 푸는 정책(양적완화)을 이어 가고 있고, 유럽 일부 나라의 빚 문제가 드러나고 있어요. 돈이 넘치면 주식과 금 같은 자산 값이 오를 수 있어요.","유럽 나라들이 빚을 갚기 어렵지 않을까 하는 걱정이 커지면, 사람들이 위험한 투자를 피하고 금과 달러 같은 안전한 자산을 찾을 수 있어요. (위험회피)","유럽 위기가 진정되며 불안이 줄자, 신흥국으로 돈이 다시 들어오고 있는 것 같아요. 환율이 내려가면(원화 강세) 수출 기업에는 불리하고 수입 기업에는 유리해질 수 있어요.","미국이 돈을 푸는 속도를 줄일 거란 소식(테이퍼링)에 신흥국에서 돈이 빠질까 걱정이 커지고 있어요. 하지만 우리나라는 수출로 번 돈이 많아 상대적으로 잘 버틸 수도 있어요.","유가가 크게 떨어지면 기름값이 싸져 항공·운송업에는 도움이 될 수 있지만, 정유·화학 회사는 제품을 팔 수 있는 값이 내려가 힘들어질 수 있어요.","중국 경제의 성장이 느려지면, 중국에 수출을 많이 하는 우리나라 기업의 판매가 줄어 경제에 부담이 될 수 있어요. 낮은 유가까지 겹쳐 수출 기업의 실적 걱정이 커질 수 있어요.","금리가 낮은 상태에서 브렉시트(영국의 EU 탈퇴)와 미국 대선 같은 큰 이벤트가 있어 시장이 크게 흔들릴 수 있어요. 투자자들이 예금 말고 돈을 둘 곳을 찾고 있는 것 같아요.","세계 경제가 함께 좋아지고 있어서 우리 수출이 늘 수 있어요. 특히 반도체 값이 오르고 있어 기업 이익이 크게 늘 거라는 기대가 커요.","미국이 금리를 올리고 미국·중국이 관세로 다투고 있어서, 달러가 인기를 끌고 신흥국 주식은 약해질 수 있어요.","미국의 단기 금리가 장기 금리보다 높아지는 일(금리 역전)은 경기가 나빠질 신호로 읽혀요. 그래서 미국이 금리를 내리며 대비할 가능성이 있어요.","코로나로 경제가 멈추자 각국이 금리를 거의 0으로 내리고 돈을 크게 풀고 있어요. 갈 곳 잃은 돈이 주식으로 몰릴 수 있고, 성장 기대가 큰 주식이 인기를 끌 수 있어요.","물건이 부족해 값이 오르는(인플레이션) 걱정이 커지고, 미국이 돈 푸는 걸 줄일 계획을 알리고 있어요. 넘치던 돈의 파티가 끝나 가는 신호일 수 있어요.","전쟁으로 에너지 값이 뛰고 물가가 치솟아, 미국이 금리를 아주 빠르게 올릴 수 있다는 전망이 나와요. 그러면 달러가 강해지고 미래 성장을 기대하는 주식 값이 크게 내려갈 수 있어요.","금리가 높은 채로 오래갈 것 같다는 전망이 나오지만, 인공지능(AI) 덕분에 반도체 수요가 다시 살아날 거란 기대도 커지고 있어요.","AI 열풍으로 반도체 투자가 커지고 있고, 미국이 금리를 내리기 시작할 것 같아요. 한편 환율이 크게 오르면 외국인 투자자의 사고팔기 흐름이 흔들릴 수 있어요.","미국의 관세 정책으로 불확실성이 커지면, 안전한 자산인 금이 인기를 끌 수 있어요. 우리나라에서는 기업이 주주에게 더 잘 나눠 주도록 하는 정책(밸류업)에 대한 기대도 커요."];
const NB2=["거품이 낀 분야는 한꺼번에 크게 떨어질 수 있어요. 한 분야에 몰아 투자하면 위험할 수 있어요.","불안한 시기에는 금 같은 안전자산이 상대적으로 잘 버틸 수 있어요. 금리가 내려가면 예금 이자는 줄 수 있어요.","금리가 낮으면 예금 이자가 적어서, 안전하면서도 수익이 나는 곳을 찾는 사람이 늘 수 있어요.","불안이 줄고 경기가 살아나기 시작하면, 많이 떨어졌던 주식이 다시 오를 수도 있어요.","세계 경제가 좋아지면 수출 비중이 큰 기업이나 원자재와 관련된 기업의 이익이 늘 수 있어요.","기름값이 오르면 항공·운송 회사는 힘들어지고, 석유·에너지 관련 기업은 이익이 늘 수 있어요.","환율이 내려가면 수출 기업은 불리해지고, 수입 기업이나 해외여행에는 유리해질 수 있어요. 환율 뉴스를 같이 보는 게 좋아요.","경기가 좋을 때는 주가가 빠르게 올라 가격 부담이 커질 수 있어요. 너무 올랐을 때 한 번에 몰아서 사는 건 조심하는 게 좋아요.","모든 주식이 함께 떨어지는 위기에는 주식끼리만 나누는 분산투자로는 한계가 있을 수 있어요. 그럴 때는 금이나 현금 같은 자산이 방패가 되기도 해요.","위기 뒤의 반등은 빠르게 올 수 있어요. 바닥에서 겁먹고 다 팔면 회복의 이익을 놓칠 수 있어요.","돈이 넘칠 때는 금이나 주식 같은 자산이 인기를 끌 수 있지만, 나라 빚 문제 같은 뉴스에는 갑자기 흔들릴 수 있어요.","안전자산 선호가 강할 때는 금이 강하고 위험이 큰 주식은 흔들릴 수 있어요. 분산투자가 필요한 이유예요.","위기가 진정되면 이익에 비해 주식이 싸 보여서(낮은 PER) 다시 사들이는 사람이 늘 수 있어요.","달러가 강해지면 달러로 거래되는 금은 값이 내려갈 수 있어요. 금 투자는 환율과 금리 뉴스를 같이 보는 게 좋아요.","유가가 내리면 연료비가 줄어드는 업종은 웃고, 석유·화학 업종은 이익이 줄 수 있어요.","수출 비중이 큰 기업은 중국 경기 뉴스에 민감할 수 있어요. 중국 관광객 매출이 큰 소비재 회사도 영향을 받을 수 있어요.","큰 이벤트로 시장이 흔들릴 때는 변동성(가격이 오르내리는 폭)이 커질 수 있어요. 한 곳에 몰아 투자하면 위험할 수 있어요.","반도체 값이 오르면 메모리를 만드는 회사의 이익이 크게 늘 수 있어요. 이익이 늘면 주가도 따라 오를 수 있어요.","달러가 강하면 신흥국 주식이 약해질 수 있어요. 이럴 때는 예금이나 금처럼 흔들림이 적은 자산도 선택지가 될 수 있어요.","금리가 내려가면 예금 이자는 줄고, 대신 금이나 주식 쪽으로 눈을 돌리는 사람이 늘 수 있어요.","금리가 아주 낮으면 예금의 매력이 떨어져요. 미래에 크게 성장할 회사(바이오·IT)의 값이 오르기 쉬운 환경이 될 수 있어요.","돈이 많이 풀린 뒤에는 주식이 이미 많이 올라 비싸졌을(고평가) 수 있어요. 비싼 가격에 사는 건 조심하는 게 좋아요.","금리가 오르면 예금 이자는 커지고, 아직 이익이 작은 성장주는 가격 부담이 커져 내려갈 수 있어요.","반도체는 쌓인 재고를 다 팔고 나면 다시 주문이 늘 수 있어요. 바닥을 지나는 신호를 찾는 게 중요해요.","AI 서버에 쓰는 고성능 메모리(HBM) 수요가 늘면 관련 회사가 주목받을 수 있어요. 환율이 오르면 수출 기업 매출이 원화로는 더 커질 수 있어요.","불안한 시기에는 금이 인기를 끌 수 있고, 주주에게 이익을 나눠 주는 회사(배당·자사주)가 주목받을 수 있어요."];
const PN2={dep:['[금융] 시중은행 정기예금 금리, 기준금리 흐름 따라 조정… 예금자보호 한도 내 원리금 보호'],gold:['[원자재] 안전자산 선호 확산에 금값 강세… 달러 약세·중앙은행 매입 확대가 지지','[원자재] 실질금리 상승·달러 강세에 금값 하방 압력… 안전자산 선호 약화'],kospi:['[증시] 외국인 순매수 확대에 코스피 상승… 기업이익(EPS) 컨센서스 상향 조정','[증시] 외국인 순매도 지속에 코스피 약세… 상장사 이익 전망 하향'],sp:['[해외증시] 빅테크 실적 호조에 S&P500 상승… 원/달러 환율 상승 시 환차익 기대','[해외증시] 기준금리 인상 부담에 S&P500 멀티플(PER) 축소… 성장주 중심 조정'],ent:['[엔터] K-팝 월드투어·음반 판매 호조… 영업이익 컨센서스 상회(어닝 서프라이즈) 기대','[엔터] 아티스트 리스크·광고 업황 둔화에 실적 눈높이 하향'],it:['[반도체] D램·낸드 고정거래가격 반등… ASP 상승에 영업이익 개선 전망','[반도체] 재고 확대에 메모리 가격 하락… 감산 압력·실적 컨센서스 하향'],bio:['[바이오] 임상 3상 성공 기대감… FDA 허가 기대에 파이프라인 가치 재평가','[바이오] 임상 일정 지연에 투자심리 위축… 금리 부담으로 밸류에이션 조정'],food:['[식품] 해외 수요 급증에 수출 확대… 생산능력(CAPA) 증설 추진','[식품] 원재료 가격 상승에 마진 압박… 판가 인상 여부 주목'],beauty:['[화장품] 중국·미국 매출 회복세… 온라인 채널 확대에 실적 개선 기대','[화장품] 중국 소비 부진·면세 채널 매출 감소에 실적 부담'],chem:['[화학] 배터리 소재 수주 확대… 스프레드(제품·원료 가격차) 개선','[화학] 석유화학 공급 과잉에 스프레드 축소… 가동률 조정 불가피'],ship:['[조선] LNG운반선 등 고부가 선박 수주잔고 증가… 선가 상승에 수익성 개선','[조선] 신규 수주 부진·후판 가격 부담에 수익성 우려']};

const SRC_HIDDEN=`<details class="card"><summary>📎 출처·검증 상태</summary><p><b>확인한 자료</b></p><ul><li>코스피, 원/달러 환율, 금 가격(IMF, 원화로 환산), 한국은행 기준금리: 한국거래소·ECOS·한국은행·IMF·금융투자협회 자료로 계산했어요.</li><li>S&P500: 미국 달러 기준 연간 총수익률(배당 포함, slickcharts)에 원/달러 연말 환율 변화를 반영해 원화로 바꿨어요.</li><li>유가(WTI 연평균): FRED(미국 세인트루이스 연준). 소비자물가 상승률: FRED(세계은행 자료).</li><li>개별 주식 8종(K-엔터·K-IT·K-바이오·K-식품·K-뷰티·K-화학·K-통신·K-조선): 실제 한국 상장 회사의 연말 종가로 주가 변화율만 계산했어요(배당 제외, 액면분할·무상증자·감자는 반영). 두 곳 이상의 시세 자료와 금융감독원 전자공시(DART) 원문, 신문 기사로 확인했어요.</li><li>🙈 게임을 공정하게 하려고 어떤 회사인지는 게임 화면에서 밝히지 않아요. 극비뉴스도 회사와 제품 이름을 빼고 실제 사건(DART 사업보고서의 '회사의 연혁', 신문 기사)을 바탕으로 썼어요. 사건 뒤에 붙인 '왜 그런 행동을 하는지'는 회사 발표·사업보고서·기사에서 확인한 이유를 썼고, 확인하지 못한 곳은 '보통 ~할 때 이렇게 해요'처럼 일반적인 설명으로 썼어요.</li></ul><p><b>검증 전 · 대신 쓴 값</b></p><ul><li>정기예금: 은행별 예금금리 자료가 없어, 투자 시작일의 한국은행 기준금리를 정기예금 금리로 가정해 계산했어요(실제 예금금리와는 다를 수 있어요).</li><li>2000~2010년의 세계 이슈와 S&P500 시황은 날짜·숫자를 검색으로 확인했어요. 뉴스 브리핑은 이 사실을 쉽게 풀어 쓴 해설이에요. 금 뉴스는 IMF 월평균 자료로, 정기예금 뉴스는 한국은행 기준금리 변경일로 만들었어요.</li><li>K-뷰티 2006년 이전: 시세 자료의 연말 종가가 DART 사업보고서의 12월 주가 범위 안에 드는지 확인했어요. 회사가 둘로 나뉜 2006년은 재상장 기준가격으로 2005년 말 주가를 추정해 계산했어요. 아직 상장하지 않았던 시기의 종목은 목록에 보이지 않아요.</li></ul></details>`;

NB1:["인터넷 회사에 대한 기대가 너무 커서 주가가 부풀어 있는(거품) 것 같아요. 거품은 갑자기 꺼질 수도 있어요.","큰 사건이 터지면 사람들이 겁을 먹고 위험한 투자를 피할 수 있어요. 나라들은 경제를 살리려고 금리를 내릴지도 몰라요.","금리가 낮으면 사람들이 빚을 내서 쓰기 쉬워져요. 하지만 빚이 너무 늘면 나중에 문제가 될 수 있어요.","빌린 돈을 못 갚는 사람이 늘면 금융회사가 힘들어질 수 있어요. 전쟁 걱정까지 겹쳐 투자자들이 더 조심하는 것 같아요.","미국이 금리를 올리면 돈이 미국으로 몰릴 수 있어요. 한편 중국 경제가 빠르게 성장하고 있어서, 중국에 물건을 많이 파는 우리나라 수출이 늘어날 수도 있어요.","기름값이 오르면 물건값도 올라 사람들이 덜 쓰게 될 수 있어요. 그래도 세계 경제가 커지면 주가는 오를 수 있어요.","우리 돈 값이 오르면(환율이 내려가면) 수출 회사는 물건을 팔고 받는 원화가 줄 수 있어요.","미국에서 집값이 떨어지면서, 집을 맡기고 빌린 돈을 못 갚는 사람이 늘어날지도 몰라요.","큰 금융회사가 흔들리면 은행들이 서로 돈을 안 빌려주려 할 수 있어요. 그러면 전 세계 주가가 함께 떨어질 수도 있어요.","여러 나라가 금리를 내리고 시중에 돈을 많이 풀고 있어서, 불안이 줄면 주가가 회복할 수도 있어요.","미국이 시중에 돈을 더 풀고 있어서 주식이나 금 값이 오를 수 있어요. 하지만 유럽 몇몇 나라가 빚을 못 갚을 수 있다는 걱정도 커지고 있어요.","유럽 나라들이 빚을 못 갚을까 걱정되면, 사람들이 금처럼 안전한 곳으로 돈을 옮길 수 있어요.","유럽 안에서 걱정하는 분위기가 줄어들자, 돈이 다시 주식시장에 몰려들고 있는 것 같아요. 환율이 내려가면(우리 돈 값이 오르면) 수출 회사는 불리해질 수 있어요.","미국이 시중에 풀던 돈을 줄인다는 소식에, 다른 나라에 투자했던 돈이 미국으로 빠져나갈까 걱정이 커지고 있어요. 그래도 우리나라는 수출로 번 돈이 많아 잘 버틸 수도 있어요.","기름값이 크게 내리면 비행기·운송 회사는 좋아지고, 기름을 파는 회사는 힘들어질 수 있어요.","중국 경제가 침체되거나 성장이 느려지면, 중국에 수출을 많이 하는 우리나라 경제에도 부담이 될 수 있어요.","영국의 EU 탈퇴, 미국 선거 같은 큰 사건 때문에 주식시장이 크게 흔들릴 수 있어요.","세계 경제가 함께 좋아지고 반도체 값이 오르고 있어서, 회사 이익이 크게 늘 수도 있어요.","미국이 금리를 올리고, 미국과 중국이 관세(수입품에 매기는 세금)로 다투고 있어요. 그러면 안전한 달러를 찾는 사람이 늘고, 우리나라 같은 다른 나라의 주가는 약해질 수 있어요.","경기가 나빠질 거라는 신호가 보여서, 미국이 미리 금리를 내릴지도 몰라요.","코로나로 경제가 멈추자 여러 나라가 금리를 거의 0으로 내리고 시중에 돈을 많이 풀고 있어요. 그 돈이 주식으로 몰릴 수도 있어요.","물건이 모자라 값이 오를(인플레이션) 것 같다는 걱정이 커지고, 미국이 시중에 푸는 돈을 줄이겠다고 해요. 그러면 주식시장으로 들어오던 돈이 줄어들 수 있어요.","전쟁으로 에너지 값이 뛰고 물가가 치솟아서, 미국이 금리를 아주 빠르게 올릴지도 몰라요.","금리가 높은 채로 오래갈 것 같지만, AI 덕분에 반도체가 다시 잘 팔릴 거라는 기대도 커지고 있어요.","AI 열풍으로 반도체 투자가 늘고 있고, 미국이 금리를 내리기 시작할지도 몰라요.","미국 관세 때문에 앞일이 불안해지면, 안전한 금이 인기를 끌 수 있어요."],
NB2:["한 분야에 몰아서 투자하면, 그 분야가 무너질 때 크게 잃을 수 있어요.","불안할 때는 금 같은 안전자산이 잘 버틸 수 있어요. 금리가 내리면 예금 이자는 줄 수 있어요.","예금 이자가 줄면 사람들이 돈을 더 불릴 다른 곳을 찾을 수 있어요.","불안이 줄고 경기가 살아나면, 많이 떨어졌던 주식이 다시 오를 수도 있어요.","세계 경제가 좋아지면 물건을 많이 수출하는 회사가 돈을 더 벌 수 있어요.","기름값이 오르면 비행기·운송 회사는 힘들어지고, 에너지 회사는 이익이 늘 수 있어요.","환율이 내려가면 수출 회사는 불리해지고, 해외여행은 싸질 수 있어요.","값이 너무 오른 뒤에 한꺼번에 사는 건 조심하는 게 좋아요.","모든 주식이 함께 떨어질 때는 금이나 현금이 방패가 될 수 있어요.","위기 뒤에는 주가가 빨리 회복할 때가 많아요. 겁먹고 다 팔면 회복을 놓칠 수 있어요.","돈이 넘치면 주식과 금이 인기를 끌 수 있지만, 나라 빚 소식에 갑자기 흔들릴 수 있어요.","불안할 때는 금이 강하고 주식은 흔들릴 수 있어요. 그래서 나눠 투자하는 분산투자가 도움이 돼요.","위기가 지나면 주식이 저렴해 보여서, 다시 관심을 갖는 사람이 늘어날 수 있어요.","금은 주로 달러로 사고팔아서, 달러가 강해지면 금값은 내려갈 수 있어요.","기름값이 내리면 기름을 많이 쓰는 회사는 웃고, 기름을 파는 회사는 힘들어질 수 있어요.","수출을 많이 하는 회사는 중국 경제 소식에 민감할 수 있어요.","큰 사건이 있을 때는 값이 크게 오르내릴 수 있어요. 한 곳에 몰아 투자하면 위험해요.","회사 이익이 늘면 주가도 따라 오를 수 있어요.","달러가 강할 때는 예금이나 금처럼 덜 흔들리는 자산도 좋은 선택이 될 수 있어요.","금리가 내리면 예금 이자가 줄어, 금이나 주식을 찾는 사람이 늘 수 있어요.","금리가 아주 낮으면 예금보다 앞으로 크게 성장할 회사가 인기를 끌 수 있어요.","이미 많이 오른 주식을 비싸게 사는 건 조심하는 게 좋아요.","금리가 오르면 예금 이자는 늘고, 아직 돈을 많이 못 버는 회사의 주가는 내려갈 수 있어요.","반도체는 쌓인 물건을 다 팔고 나면 다시 주문이 늘 수 있어요.","환율이 오르면 수출 회사가 물건을 팔고 받은 달러를 원화로 바꿀 때 더 많은 돈을 받을 수 있어요.","불안할 때는 금이 인기를 끌 수 있고, 이익을 주주에게 잘 나눠 주는 회사가 주목받을 수 있어요."],
